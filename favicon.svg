<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Degradat de fons fosc d'alt contrast -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Degradat de la fletxa d'Aufbau/Moeller -->
    <linearGradient id="aufbauArrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Ombra paral·lela per donar profunditat -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Fons de la icona amb cantonades arrodonides -->
  <rect width="512" height="512" rx="100" fill="url(#bgGradient)" />

  <g filter="url(#glow)">
    <!-- 1. CASALLES D'ORBITAL ESGLAONADES (SUBNIVELLS ENERGÈTICS) -->
    
    <!-- Subnivell 1s (Abaix a l'esquerra) - Bloc s (Rosa) -->
    <rect x="80" y="320" width="85" height="85" rx="12" fill="#fbcfe8" stroke="#f472b6" stroke-width="6" />
    <!-- Espins 1s (↑↓) -->
    <path d="M110 380 V345 M100 358 L110 345 L120 358" stroke="#831843" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M135 345 V380 M125 367 L135 380 L145 367" stroke="#831843" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Subnivell 2s (Centre-Esglaó) - Bloc s (Rosa) -->
    <rect x="195" y="230" width="85" height="85" rx="12" fill="#fbcfe8" stroke="#f472b6" stroke-width="6" />
    <!-- Espin 2s (↑) -->
    <path d="M237 290 V255 M227 268 L237 255 L247 268" stroke="#831843" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Subnivell 2p (A dalt a la dreta) - Bloc p (Turquesa) -->
    <rect x="310" y="140" width="130" height="85" rx="12" fill="#99f6e4" stroke="#2dd4bf" stroke-width="6" />
    <!-- Línies separadores d'orbitals p (3 caselles) -->
    <line x1="353" y1="140" x2="353" y2="225" stroke="#2dd4bf" stroke-width="4" />
    <line x1="396" y1="140" x2="396" y2="225" stroke="#2dd4bf" stroke-width="4" />
    <!-- Espin 2p1 (↑) -->
    <path d="M331 200 V165 M323 176 L331 165 L339 176" stroke="#134e4a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 2. FLETXA DIAGONAL D'OMPLIMENT D'AUFBAU (DIAGRAMA DE MOELLER) -->
    <!-- Línia diagonal principal -->
    <line x1="60" y1="430" x2="430" y2="90" stroke="url(#aufbauArrow)" stroke-width="22" stroke-linecap="round" />
    <!-- Cap de la fletxa -->
    <path d="M380 75 L455 75 L455 150 Z" fill="#fbbf24" />
  </g>
</svg>